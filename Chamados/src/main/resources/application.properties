spring.application.name=chamados

# H2 em memoria: o projeto sobe sem instalar banco nenhum. A cada start o schema
# e recriado e o data.sql repovoa a base com os chamados de demonstracao.
spring.datasource.url=jdbc:h2:mem:chamados
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

# A sessao do JPA fecha ao sair do service, e nao ao fim da resposta: assim uma
# consulta preguicosa nao dispara SQL durante a serializacao do JSON.
spring.jpa.open-in-view=false

# Sem isso o data.sql roda antes de o Hibernate criar as tabelas e o start falha.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Console do banco em http://localhost:8081/h2-console (JDBC URL: jdbc:h2:mem:chamados)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8081
